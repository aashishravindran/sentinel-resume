[project]
name = "sentinel-resume"
version = "0.1.0"
description = "Resume assistant demo: recruiters chat with a RAG assistant that retrieves only what they may read"
requires-python = ">=3.12"
dependencies = [
    "sentinel-engine",
    "boto3>=1.42",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "moto[dynamodb]>=5.0",
    "cryptography>=43",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pypdf>=4.0",
]

[tool.uv.sources]
sentinel-engine = { git = "https://github.com/aashishravindran/sentinel-engine", tag = "v0.1.0" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "redteam: adversarial tests; no restricted chunk may ever reach the model",
    "aws: tests that call the deployed stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra/cdk.out", "infra/node_modules", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel_resume"]

[tool.pyright]
include = ["sentinel_resume"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_resume"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
