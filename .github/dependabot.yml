# Security updates open as soon as an advisory lands (not grouped, so a fix is never held back).
# Version updates arrive weekly as at most two PRs per directory: minor/patch, and majors. Majors
# usually need code changes, so they are expected to fail checks until someone migrates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: npm
    directory: /infra
    schedule: { interval: weekly }
    groups:
      infra:
        patterns: ["*"]
        update-types: [minor, patch]
      infra-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
