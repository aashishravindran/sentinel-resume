name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
      - name: Unit, workflow, trigger and red-team tests
        run: uv run pytest -q
      # Any known vulnerability in a locked dependency fails the required check.
      # (sentinel-engine is a git dependency; it is audited in its own repo.)
      - name: Audit Python dependencies
        run: |
          uv export --no-hashes --all-groups --no-emit-project | grep -v '^ *#' | grep -v 'git+' > requirements-audit.txt
          uvx pip-audit@2.9.0 -r requirements-audit.txt --no-deps --disable-pip --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      # Any severity fails: the repo carries zero known vulnerabilities, dev tools included.
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Lambda bundle
        run: ./scripts/build_lambda.sh
      - name: CDK tests and synth
        working-directory: infra
        run: |
          npm ci
          npm audit --audit-level=low
          npx tsc --noEmit
          npm test
          npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-east-1
      # Deploy exactly what was tested, not a rebuild.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lambda
          path: build/lambda
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend
          path: frontend/dist
          retention-days: 7

  deploy:
    needs: [python, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The deploy role trusts only this environment, and the environment admits only master.
    environment:
      name: production
      url: https://d381grodpq0ta7.cloudfront.net
    # One deploy at a time; a newer push waits rather than cancelling a deploy halfway.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lambda
          path: build/lambda
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend
          path: frontend/dist
      # Install everything before AWS credentials exist, so install scripts never see them.
      - name: Install dependencies
        run: |
          npm ci --prefix infra
          uv sync
      # Role ARNs are environment secrets, and the account ID is masked: these logs are public.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-duration-seconds: 1800
      - name: Deploy the stack
        working-directory: infra
        run: npx cdk deploy SentinelResume --exclusively --require-approval never --role-arn "$CFN_EXEC_ROLE_ARN"
        env:
          CFN_EXEC_ROLE_ARN: ${{ secrets.CFN_EXEC_ROLE_ARN }}
      - name: Re-embed the corpus
        run: uv run python -m scripts.ingest_corpus
      - name: Reset the demo accounts in the README
        run: uv run python -m scripts.test_users create
      - name: Live end-to-end check
        run: uv run python -m scripts.e2e
